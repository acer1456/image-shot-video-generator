name: Deploy to GitHub Pages

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set base path (main → root, preview → /preview/)
        id: basepath
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
            echo "dest=." >> $GITHUB_OUTPUT
          else
            echo "base=/${{ github.event.repository.name }}/preview/" >> $GITHUB_OUTPUT
            echo "dest=preview" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.basepath.outputs.base }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.basepath.outputs.dest }}
          keep_files: true
